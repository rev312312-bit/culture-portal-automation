name: api-tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run API tests
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: pytest -m "api and smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: reports/
