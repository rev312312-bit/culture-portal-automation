[pytest]
testpaths = tests
pythonpath = .
bdd_features_base_dir = features/
base_url = https://www.culture.go.kr
addopts =
    -ra
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output test-results
    --html=reports/report.html
    --self-contained-html
xfail_strict = true
markers =
    smoke: 핵심 흐름 빠른 점검 (push 마다 CI 실행)
    regression: 전체 회귀 테스트
    api: API 테스트 (tests/api)
    ui: 화면 테스트 (tests/ui)
    known_defect(id): 이미 보고된 결함을 재현하는 테스트
    tc(id): 연결된 팀 수동 TC ID (추적성)
